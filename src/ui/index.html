<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>HuntDesk</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app">
  <aside id="lado">
    <div class="marca"><img src="icone.png" alt=""><span class="some">HuntDesk</span></div>
    <div class="tela app-card" id="app-card" role="button" tabindex="0" data-app
      title="App do HuntDesk aqui dentro, no lugar das contas (o login dele fica guardado à parte). Clique numa tela para voltar ao jogo.">
      <img src="icone.png" alt=""><span class="nomes some">App do HuntDesk</span><span class="linha2 some" id="app-linha2"></span>
    </div>
    <div id="lista"></div>
    <button class="mais" id="nova-pasta" title="Uma pasta nova, por exemplo para outro jogo"><span class="some">+ Nova pasta</span><span class="so-recolhida">+</span></button>
    <button class="recolher" id="recolher" title="Recolher ou abrir esta barra (Ctrl+B)"><span id="seta">«</span> <span class="some">Recolher</span></button>
  </aside>
  <main id="area">
    <div id="vazio" hidden>
      <p>Nenhuma conta ligada nesta tela.</p>
      <p class="nota">Clique numa tela na barra ao lado: as contas dela ligam e aparecem aqui.</p>
    </div>
  </main>
  <footer id="baixo">
    <button class="saude" id="saude"></button>
    <span class="sep"></span>
    <button id="economia" title="Modo do Chrome para computador fraco: cada conta gasta bem menos memória e a imagem fica um pouco mais simples. Trocar fecha e abre o programa."></button>
    <span class="nota" id="total"></span>
    <span class="espaco"></span>
    <button id="reiniciar" class="forte" hidden></button>
    <button id="cheia" title="Tela cheia (F11)"></button>
    <button id="abrir-menu" title="Medições, contas e configurações">Menu ▴</button>
  </footer>
</div>
<div id="celulas"></div>
<script src="comum.js"></script>
<script src="ui.js"></script>
</body>
</html>
